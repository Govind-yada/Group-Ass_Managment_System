# Render Infrastructure-as-Code Blueprint Specification
# Reference: https://render.com/docs/blueprint-spec

databases:
  - name: joineazy-postgres
    databaseName: joineazy_db
    user: joineazy_user
    plan: free
    region: oregon

services:
  # 1. Joineazy Backend REST API Service
  - type: web
    name: joineazy-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-postgres
          property: connectionString
      - key: CLIENT_URL
        value: "*"

  # 2. Joineazy Frontend SPA Static Site
  - type: web
    name: joineazy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://joineazy-backend-n8ep.onrender.com/api
